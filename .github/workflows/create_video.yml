name: Create 3 Islamic Dua Videos

on:
  workflow_dispatch:

  schedule:
    - cron: "0 5 * * *"

jobs:

  create-videos:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # SYSTEM PACKAGES
      # ======================================================

      - name: Install FFmpeg and Arabic/Urdu font support
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-core \
            fonts-noto-extra \
            libraqm-dev \
            libfribidi-dev

          echo "FFmpeg:"
          ffmpeg -version | head -1

          echo "Arabic font:"
          fc-match "Noto Naskh Arabic"

          echo "Urdu font:"
          fc-match "Noto Nastaliq Urdu"


      # ======================================================
      # PYTHON PACKAGES
      # ======================================================

      - name: Install Python packages
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ======================================================
      # CHECK PROJECT
      # ======================================================

      - name: Check project files
        run: |

          echo "Checking project..."

          test -f create_video.py

          test -f requirements.txt

          test -f data/duas.json

          test -f audio/islamic_background.mp3

          echo "All required project files found."


      # ======================================================
      # CREATE FOLDERS
      # ======================================================

      - name: Prepare folders
        run: |

          mkdir -p output
          mkdir -p work

          echo "Folders prepared."


      # ======================================================
      # CREATE 3 VIDEOS
      # ======================================================

      - name: Create 3 Islamic Dua Videos
        env:

          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

        run: |

          python create_video.py


      # ======================================================
      # CHECK OUTPUT
      # ======================================================

      - name: Validate final ZIP
        run: |

          echo "Output directory:"
          ls -lah output/

          echo ""
          echo "ZIP files:"

          find output \
            -maxdepth 1 \
            -type f \
            -name "*.zip" \
            -print

          ZIP_COUNT=$(find output \
            -maxdepth 1 \
            -type f \
            -name "*.zip" \
            | wc -l)

          echo ""
          echo "ZIP count: $ZIP_COUNT"

          if [ "$ZIP_COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly ONE ZIP artifact."
            exit 1
          fi

          ZIP_FILE=$(find output \
            -maxdepth 1 \
            -type f \
            -name "*.zip" \
            -print -quit)

          echo ""
          echo "ZIP:"
          echo "$ZIP_FILE"

          test -f "$ZIP_FILE"

          echo ""
          echo "ZIP CONTENTS:"
          unzip -l "$ZIP_FILE"


      # ======================================================
      # UPLOAD ONLY ONE ARTIFACT
      # ======================================================

      - name: Upload 3 Videos ZIP
        uses: actions/upload-artifact@v4

        with:

          name: Islamic-Dua-3-Videos-${{ github.run_number }}

          path: output/*.zip

          if-no-files-found: error

          retention-days: 7


      # ======================================================
      # UPDATE USED DUA LIST
      # ======================================================

      - name: Commit used Dua list
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add used_duas.json

          git diff --cached --quiet \
            || git commit -m "Update used Dua list"

          git push
