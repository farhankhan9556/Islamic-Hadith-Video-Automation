name: Create Islamic Videos

on:
  workflow_dispatch:

  schedule:
    - cron: "0 5 * * *"
    - cron: "0 9 * * *"
    - cron: "0 16 * * *"

concurrency:
  group: islamic-video-generator
  cancel-in-progress: false

permissions:
  contents: write

jobs:

  create-video:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libfribidi-dev \
            libharfbuzz-dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Verify project files
        run: |
          test -f create_video.py
          test -f used_hadith.json
          test -f fonts/NotoNaskhArabic-Regular.ttf
          test -f audio/islamic_background.mp3
          echo "All required files are present."

      - name: Create Islamic video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python create_video.py

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: islamic-video-${{ github.run_number }}
          path: output/
          if-no-files-found: error

      - name: Save used Hadith list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add used_hadith.json

          if git diff --cached --quiet; then
            echo "No Hadith list changes."
          else
            git commit -m "Update used Hadith list"
            git push
          fi
