name: Create Islamic Dua Video

on:

  workflow_dispatch:

  schedule:

    # 09:00 UAE = 05:00 UTC
    - cron: "0 5 * * *"

    # 13:00 UAE = 09:00 UTC
    - cron: "0 9 * * *"

    # 20:00 UAE = 16:00 UTC
    - cron: "0 16 * * *"


jobs:

  create-video:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # PYTHON
      # --------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # --------------------------------------------------
      # INSTALL DEPENDENCIES
      # --------------------------------------------------

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # --------------------------------------------------
      # CHECK FFMPEG
      # --------------------------------------------------

      - name: Check FFmpeg
        run: |
          ffmpeg -version


      # --------------------------------------------------
      # CREATE OUTPUT FOLDERS
      # --------------------------------------------------

      - name: Prepare folders
        run: |
          mkdir -p output
          mkdir -p work


      # --------------------------------------------------
      # RUN VIDEO CREATOR
      # --------------------------------------------------

      - name: Create Dua video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

        run: |
          python create_video.py


      # --------------------------------------------------
      # UPLOAD VIDEO AS GITHUB ARTIFACT
      # --------------------------------------------------

      - name: Upload generated video
        uses: actions/upload-artifact@v4

        with:

          name: Islamic-Dua-Video-${{ github.run_number }}

          path: |
            output/*.mp4
            output/*.json

          if-no-files-found: error


      # --------------------------------------------------
      # SAVE USED DUA LIST
      # --------------------------------------------------

      - name: Commit used Dua list
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add used_duas.json

          git diff --cached --quiet || git commit -m "Update used Dua list"

          git push
