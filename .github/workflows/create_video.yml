name: Create Islamic Dua Video

on:

  workflow_dispatch:

  schedule:

    # 09:00 UAE = 05:00 UTC
    - cron: "0 5 * * *"

    # 13:00 UAE = 09:00 UTC
    - cron: "0 9 * * *"

    # 20:00 UAE = 16:00 UTC
    - cron: "0 16 * * *"


jobs:

  create-video:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ============================================
      # 1. CHECKOUT
      # ============================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================
      # 2. PYTHON
      # ============================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================
      # 3. INSTALL FFMPEG
      # ============================================

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version


      # ============================================
      # 4. INSTALL PYTHON PACKAGES
      # ============================================

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ============================================
      # 5. CHECK REQUIRED FILES
      # ============================================

      - name: Check project files
        run: |

          echo "Checking project..."

          test -f create_video.py
          test -f requirements.txt
          test -f data/duas.json
          test -f fonts/NotoNastaliqUrdu-Regular.ttf
          test -f audio/islamic_background.mp3

          echo "All required files found."


      # ============================================
      # 6. CREATE DIRECTORIES
      # ============================================

      - name: Prepare folders
        run: |
          mkdir -p output
          mkdir -p work


      # ============================================
      # 7. CREATE VIDEO
      # ============================================

      - name: Create Dua video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

        run: |
          python create_video.py


      # ============================================
      # 8. CHECK OUTPUT
      # ============================================

      - name: Check generated files
        run: |

          echo "Generated files:"

          ls -lah output/

          test -n "$(find output -name '*.mp4' -print -quit)"

          echo "Video successfully generated."


      # ============================================
      # 9. UPLOAD VIDEO
      # ============================================

      - name: Upload generated video
        uses: actions/upload-artifact@v4

        with:
          name: Islamic-Dua-Video-${{ github.run_number }}

          path: |
            output/*.mp4
            output/*.json

          if-no-files-found: error


      # ============================================
      # 10. UPDATE USED DUA
      # ============================================

      - name: Commit used Dua list
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add used_duas.json

          git diff --cached --quiet || git commit -m "Update used Dua list"

          git push
