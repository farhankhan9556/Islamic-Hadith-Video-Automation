name: Create 3 Islamic Dua Videos

on:

  workflow_dispatch:

  schedule:
    # 09:00 UAE = 05:00 UTC
    - cron: "0 5 * * *"


jobs:

  create-videos:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # ======================================================
      # SYSTEM PACKAGES
      # ======================================================

      - name: Install FFmpeg and Arabic Urdu support
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            unzip \
            fonts-noto-core \
            fonts-noto-extra \
            libraqm-dev \
            libfribidi-dev

          echo "======================================"
          echo "FFmpeg"
          echo "======================================"

          ffmpeg -version | head -1

          echo "======================================"
          echo "Arabic Font"
          echo "======================================"

          fc-match "Noto Naskh Arabic"

          echo "======================================"
          echo "Urdu Font"
          echo "======================================"

          fc-match "Noto Nastaliq Urdu"


      # ======================================================
      # PYTHON PACKAGES
      # ======================================================

      - name: Install Python packages
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ======================================================
      # PROJECT CHECK
      # ======================================================

      - name: Check required project files
        run: |

          echo "Checking project..."

          test -f create_video.py

          test -f requirements.txt

          test -f data/duas.json

          test -f audio/islamic_background.mp3

          test -f fonts/NotoNastaliqUrdu-Regular.ttf

          echo ""
          echo "All required files found."


      # ======================================================
      # PREPARE
      # ======================================================

      - name: Prepare folders
        run: |

          mkdir -p output

          mkdir -p work

          echo "Folders ready."


      # ======================================================
      # CREATE 3 VIDEOS
      # ======================================================

      - name: Create 3 Islamic Dua Videos

        env:

          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

        run: |

          python create_video.py


      # ======================================================
      # VALIDATE
      # ======================================================

      - name: Validate ONE ZIP output
        run: |

          echo "======================================"
          echo "OUTPUT DIRECTORY"
          echo "======================================"

          find output \
            -maxdepth 2 \
            -type f \
            -printf "%p\n"


          echo ""
          echo "======================================"
          echo "CHECK ZIP"
          echo "======================================"

          ZIP_COUNT=$(find output \
            -maxdepth 1 \
            -type f \
            -name "*.zip" \
            | wc -l)

          echo "ZIP count: $ZIP_COUNT"


          if [ "$ZIP_COUNT" -ne 1 ]; then

            echo ""
            echo "ERROR:"
            echo "Expected exactly ONE ZIP."
            echo ""

            exit 1

          fi


          ZIP_FILE=$(find output \
            -maxdepth 1 \
            -type f \
            -name "*.zip" \
            -print -quit)


          echo ""
          echo "ZIP FILE:"
          echo "$ZIP_FILE"


          echo ""
          echo "======================================"
          echo "ZIP CONTENTS"
          echo "======================================"

          unzip -l "$ZIP_FILE"


          echo ""
          echo "======================================"
          echo "CHECK VIDEOS"
          echo "======================================"

          VIDEO_COUNT=$(unzip -Z1 "$ZIP_FILE" \
            | grep -E '\.mp4$' \
            | wc -l)

          echo "Videos inside ZIP: $VIDEO_COUNT"


          if [ "$VIDEO_COUNT" -ne 3 ]; then

            echo "ERROR: ZIP must contain exactly 3 MP4 files."

            exit 1

          fi


          echo ""
          echo "Validation successful."


      # ======================================================
      # UPLOAD ONLY ONE ARTIFACT
      # ======================================================

      - name: Upload ONE ZIP artifact

        uses: actions/upload-artifact@v4

        with:

          name: Islamic-Dua-3-Videos-${{ github.run_number }}

          path: output/*.zip

          if-no-files-found: error

          retention-days: 7


      # ======================================================
      # UPDATE USED DUA LIST
      # ======================================================

      - name: Commit used Dua list
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add used_duas.json


          if git diff --cached --quiet; then

            echo "No used Dua changes."

          else

            git commit \
              -m "Update used Dua list"

            git push

          fi
